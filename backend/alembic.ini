[alembic]

# Alembic migration script directory.
script_location = %(here)s/alembic

# Add the backend directory to Python import paths.
prepend_sys_path = .

# Use the operating system path separator.
path_separator = os

# The real database URL is set by alembic/env.py.
# Do not store database credentials in this file.
sqlalchemy.url =


[post_write_hooks]


[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARN
handlers = console
qualname =


[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S